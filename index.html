<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087443">
<link rel="manifest" href="manifest.webmanifest">
<title>馬券ナビ</title>
<style>
:root{--g:#087443;--g2:#0a8b50;--bg:#f3f5f7;--ink:#17202a;--muted:#6b747d;--line:#e1e6ea;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100vh}.app{max-width:560px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;height:58px;background:#ffffffee;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center}.top h1{font-size:18px;margin:0;font-weight:850}.back{position:absolute;left:14px;background:none;color:var(--g);font-weight:750;font-size:15px}
.hero{background:linear-gradient(140deg,#075b32,#0a8b50);color:#fff;padding:26px 20px 25px;border-radius:0 0 24px 24px}.hero small{font-size:11px;letter-spacing:.12em;opacity:.8;font-weight:800}.hero h2{margin:5px 0;font-size:29px}.hero p{margin:0;font-size:14px;line-height:1.6;opacity:.93}
.content{padding:15px 13px 105px}.title{font-size:16px;font-weight:850;margin:18px 3px 9px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type{padding:16px 13px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 9px #00000008;cursor:pointer}.type.active{border-color:#54b985;background:#e9f8f0}.type b{display:block;font-size:16px}.type span{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.pill{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:750;cursor:pointer}.pill.active{background:#e6f7ee;border-color:#68bf91;color:var(--g)}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px}.panel h3{font-size:15px;margin:0 0 10px}
.horses{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.horse{aspect-ratio:1;border:1px solid #dce1e6;background:#f8f9fa;border-radius:11px;font-weight:850;cursor:pointer}.horse.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 3px 8px #0874433d}.roles{display:grid;gap:10px}.role{padding:10px;border:1px solid var(--line);border-radius:15px}.role h4{margin:0 0 8px;font-size:13px}.role .horses{grid-template-columns:repeat(6,1fr);gap:5px}.role .horse{border-radius:8px;font-size:11px}
.info{margin-top:10px;padding:10px;border-radius:12px;background:#eef8f3;font-size:12px;line-height:1.6;color:#40504a}.summary{display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;font-weight:850;background:#e6f7ee;color:var(--g);border-radius:999px;padding:6px 9px}.points{font-size:29px;font-weight:900;margin-top:5px}.sub{font-size:12px;color:var(--muted)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:560px;margin:auto;background:#ffffffef;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 13px calc(9px + env(safe-area-inset-bottom))}.primary{width:100%;padding:14px;border:0;border-radius:13px;background:var(--g);color:#fff;font-size:16px;font-weight:850;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:#0007;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#f7f8f9;width:100%;max-width:560px;margin:auto;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto}.sheethead{position:sticky;top:0;background:#ffffffef;backdrop-filter:blur(12px);padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}.sheethead b{font-size:16px}.close{background:#e9edf0;border:0;border-radius:50%;width:34px;height:34px;font-size:18px}.result{padding:15px}.slip{background:#fffdf1;border:2px solid #cfc6a0;border-radius:12px;padding:13px}.sliptop{display:flex;justify-content:space-between;font-size:12px;font-weight:900;border-bottom:2px solid #222;padding-bottom:8px}.sliprow{margin-top:12px}.sliplabel{font-size:12px;font-weight:900;margin-bottom:6px}.marks{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}.mark{aspect-ratio:1;border:1.5px solid #777;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:850;background:#fff}.mark.on{background:#111;color:#fff;border-color:#111}.check{margin-top:12px;padding:12px;background:#eaf7f0;border-radius:13px;font-size:13px;line-height:1.8}.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,20px);background:#17202a;color:#fff;padding:10px 15px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){body{padding:18px}.app{border-radius:24px;overflow:hidden;box-shadow:0 10px 40px #0002}}
</style>
</head>
<body>
<div class="app" id="app"></div><div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeResult()"><div class="sheet" id="sheet"></div></div>
<script>
const types=[
["単勝","1頭を選ぶ"],["複勝","1頭を選ぶ"],["馬連","2頭を選ぶ"],["馬単","1着→2着"],["ワイド","2頭を選ぶ"],["3連複","3頭を選ぶ"],["3連単","1着→2着→3着"]
];
const state={type:"3連単",method:"通常",single:[],one:[],two:[],three:[]};
const $=id=>document.getElementById(id);
const clear=()=>{state.single=[];state.one=[];state.two=[];state.three=[]};
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1300)}
function setType(t){state.type=t;state.method="通常";clear();render()}
function methods(){return ["単勝","複勝"].includes(state.type)?["通常"]:["通常","ボックス","ながし","フォーメーション"]}
function setMethod(m){state.method=m;clear();render()}
function toggle(key,n){let a=state[key],i=a.indexOf(n);i>=0?a.splice(i,1):a.push(n);a.sort((x,y)=>x-y);render()}
function horseGrid(key,small=false){return `<div class="horses">${Array.from({length:18},(_,i)=>i+1).map(n=>`<button class="horse ${state[key].includes(n)?"on":""}" onclick="toggle('${key}',${n})">${n}</button>`).join("")}</div>`}
function role(label,key){return `<div class="role"><h4>${label}</h4>${horseGrid(key,true)}</div>`}
function selection(){
 if(state.type==="単勝"||state.type==="複勝")return `<div class="panel"><h3>馬番を選択</h3>${horseGrid("single")}</div>`;
 if(state.method==="通常"){
   let labels=state.type==="馬単"?[["1着","one"],["2着","two"]]:state.type==="3連単"?[["1着","one"],["2着","two"],["3着","three"]]:state.type==="3連複"?[["1頭目","one"],["2頭目","two"],["3頭目","three"]]:[["1頭目","one"],["2頭目","two"]];
   return `<div class="panel"><h3>馬番を選択</h3><div class="roles">${labels.map(x=>role(x[0],x[1])).join("")}</div></div>`;
 }
 if(state.method==="box")return `<div class="panel"><h3>ボックスに入れる馬を選択</h3>${horseGrid("one")}<div class="info">選択した馬の全組み合わせを自動計算します。</div></div>`;
 if(state.method==="nagashi")return `<div class="panel"><h3>軸馬・相手を選択</h3><div class="roles">${role("軸馬","one")}${role("相手","two")}</div><div class="info">軸馬を固定して、相手との組み合わせを作ります。</div></div>`;
 return `<div class="panel"><h3>各着順の馬を選択</h3><div class="roles">${role("1着","one")}${role("2着","two")}${role("3着","three")}</div></div>`;
}
function p2(a,b){let n=0;for(const x of a)for(const y of b)if(x!==y)n++;return n}
function p3(a,b,c){let n=0;for(const x of a)for(const y of b)for(const z of c)if(new Set([x,y,z]).size===3)n++;return n}
function points(){
 const t=state.type,a=state.one.length,b=state.two.length,c=state.three.length;
 if(t==="単勝"||t==="複勝")return state.single.length;
 if(state.method==="normal"){
   if(["馬連","ワイド","馬単"].includes(t))return a===1&&b===1&&state.one[0]!==state.two[0]?1:0;
   if(t==="3連複")return a===1&&b===1&&c===1&&p3(state.one,state.two,state.three)===1?1:0;
   if(t==="3連単")return p3(state.one,state.two,state.three);
 }
 if(state.method==="box"){
   if(t==="馬連"||t==="ワイド")return a*(a-1)/2;
   if(t==="馬単")return a*(a-1);
   if(t==="3連複")return a*(a-1)*(a-2)/6;
   if(t==="3連単")return a*(a-1)*(a-2);
 }
 if(state.method==="nagashi"){
   if(a!==1)return 0;
   if(["馬連","ワイド","馬単"].includes(t))return b;
   if(t==="3連複")return b*(b-1)/2;
   if(t==="3連単")return b*(b-1);
 }
 if(state.method==="formation"){
   if(t==="馬単")return p2(state.one,state.two);
   if(t==="3連複")return p3(state.one,state.two,state.three)/6;
   if(t==="3連単")return p3(state.one,state.two,state.three);
 }
 return 0;
}
function rows(){
 const t=state.type;
 if(t==="単勝"||t==="複勝")return [["馬番",state.single]];
 if(t==="馬連"||t==="ワイド")return [["1頭目",state.one],["2頭目",state.two]];
 if(t==="馬単")return [["1着",state.one],["2着",state.two]];
 if(t==="3連複")return [["1頭目",state.one],["2頭目",state.two],["3頭目",state.three]];
 return [["1着",state.one],["2着",state.two],["3着",state.three]];
}
function render(){
 $("app").innerHTML=`<div class="top"><h1>🏇 馬券ナビ</h1></div>
 <div class="hero"><small>BETTING GUIDE</small><h2>馬券の書き方</h2><p>買いたい馬を選ぶだけ。<br>マークカードの「どこを塗るか」を確認できます。</p></div>
 <main class="content">
 <div class="title">① 馬券の種類</div><div class="grid2">${types.map(x=>`<button class="type ${state.type===x[0]?"active":""}" onclick="setType('${x[0]}')"><b>${x[0]}</b><span>${x[1]}</span></button>`).join("")}</div>
 <div class="title">② 買い方</div><div class="pills">${methods().map(m=>`<button class="pill ${state.method===m?"active":""}" onclick="setMethod('${m}')">${m}</button>`).join("")}</div>
 <div class="title">③ 買い目を選択</div>${selection()}
 <div class="title">④ 購入内容</div><div class="panel"><div class="summary"><b>${state.type}・${state.method}</b><span class="badge">${points()?points()+"点":"未完成"}</span></div><div class="points">${points()?points()*100+"円":"—"}</div><div class="sub">100円 × ${points()}点</div></div>
 </main><div class="bottom"><button class="primary" onclick="showResult()">マークカードを見る</button></div>`;
}
function showResult(){
 const n=points();if(!n){toast("まず有効な買い目を作ってください");return}
 const rs=rows();
 $("sheet").innerHTML=`<div class="sheethead"><b>マークカード</b><button class="close" onclick="closeResult()">×</button></div><div class="result"><h2 style="margin:0 0 4px">黒く塗る場所</h2><div style="font-size:13px;color:#69737d;margin-bottom:12px">● が実際にマークする馬番です。</div>
 <div class="slip"><div class="sliptop"><span>MARK CARD</span><span>${state.type}</span></div>${rs.map(r=>`<div class="sliprow"><div class="sliplabel">${r[0]}</div><div class="marks">${Array.from({length:18},(_,i)=>`<div class="mark ${r[1].includes(i+1)?"on":""}">${i+1}</div>`).join("")}</div></div>`).join("")}</div>
 <div class="check">${rs.map(r=>`✓ ${r[0]}：<b>${r[1].join("・")}</b><br>`).join("")}✓ <b>${n}点 × 100円 = ${n*100}円</b><br><span style="font-size:11px;color:#667">※実際の投票では競馬場・レース番号・金額などの欄も記入してください。</span></div></div>`;
 $("modal").classList.add("open");
}
function closeResult(){$("modal").classList.remove("open")}
render();
</script>
</body>
</html>
